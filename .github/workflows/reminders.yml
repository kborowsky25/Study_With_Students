# Session reminder emails, 24 hours and 1 hour before each confirmed session.
#
# Vercel's free Hobby plan runs cron jobs at most once a day, so GitHub Actions calls the API
# every 15 minutes instead. The endpoint sends each email once, so late or repeated runs are
# harmless. On a public repository these runs cost nothing.
#
# Setup (once):
#   1. Make a long random secret:
#        python3 -c "import secrets; print(secrets.token_hex(32))"
#   2. Vercel → Project → Settings → Environment Variables: add CRON_SECRET with that value
#      (Production; also Preview if staging should send reminders), then redeploy.
#   3. GitHub → Repository → Settings → Secrets and variables → Actions → New repository secret:
#        CRON_SECRET     the same value
#        REMINDERS_URL   https://www.studywithstudents.co.uk/api/cron/reminders
#   4. Actions tab → "Session reminders" → Run workflow. The log ends with {"sent": …}.
#
# Until both secrets exist the job skips itself without failing. GitHub may start scheduled
# runs a few minutes late, and pauses schedules after 60 days without commits (re-enable them
# from the Actions tab).
name: Session reminders

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: session-reminders
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send due reminders
        env:
          REMINDERS_URL: ${{ secrets.REMINDERS_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$REMINDERS_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::Add the REMINDERS_URL and CRON_SECRET repository secrets to send reminders."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 60 --retry 2 \
            -X POST "$REMINDERS_URL" -H "Authorization: Bearer $CRON_SECRET"
